services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8083:8000"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-300}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.92}
      FAST_MODEL_URL: ${FAST_MODEL_URL:-}
      FAST_MODEL_NAME: ${FAST_MODEL_NAME:-}
      FAST_ROUTE_TOKEN_THRESHOLD: ${FAST_ROUTE_TOKEN_THRESHOLD:-35}
      REASONING_MODEL_URL: ${REASONING_MODEL_URL:-}
      REASONING_MODEL_NAME: ${REASONING_MODEL_NAME:-}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
